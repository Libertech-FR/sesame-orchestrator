name: Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: 'La version a incrémenter (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'
      build_docker_image:
        description: "Construire l'image docker ?"
        required: true
        default: true
        type: boolean
      latest:
        description: "Tagger l'image docker avec le tag 'latest' ?"
        required: true
        default: false
        type: boolean
      unstable_only:
        description: "Construire uniquement l'image docker avec le tag 'unstable' (sans numéro de version ni release) ?"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run API unit tests
        run: yarn workspace @libertech-fr/sesame-orchestrator_api test

      - name: Build docker
        if: ${{ github.event.inputs.unstable_only != 'true' }}
        uses: ./.github/actions/release
        with:
          version_increment: ${{ github.event.inputs.version_increment }}
          build_docker_image: ${{ github.event.inputs.build_docker_image }}
          latest: ${{ github.event.inputs.latest }}
          repository: ${{ github.repository }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          access_token: ${{ secrets.GITHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          args: |
            BUILD_VERSION={{NEW_VERSION}}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            DOCKER_TAG={{NEW_VERSION}}
            IMAGE_TAG={{NEW_VERSION}}

      - name: Get repo full name
        if: ${{ github.event.inputs.unstable_only == 'true' }}
        run: echo "REPO_FULL_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        if: ${{ github.event.inputs.unstable_only == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.unstable_only == 'true' }}
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to the Container registry
        if: ${{ github.event.inputs.unstable_only == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unstable Docker image
        if: ${{ github.event.inputs.unstable_only == 'true' }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_FULL_NAME }}:unstable
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=unstable
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            DOCKER_TAG=unstable
            IMAGE_TAG=unstable
